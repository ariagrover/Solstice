<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solstice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --text: #ffffff;
    --text-soft: rgba(255,255,255,.78);
    --line: rgba(255,255,255,.35);
    --veil: rgba(0,0,0,0);
    --glass: rgba(255,255,255,.14);
    --glass-strong: rgba(255,255,255,.22);
    --sky-top: #3a7bc8;
    --sky-bottom: #6aa6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --veil: rgba(0,0,0,.18); --glass: rgba(255,255,255,.1); }
  }
  :root[data-theme="dark"] { --veil: rgba(0,0,0,.18); --glass: rgba(255,255,255,.1); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    color: var(--text);
    font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .veil { position: fixed; inset: 0; background: var(--veil); pointer-events: none; }
  .orb {
    position: fixed; width: 46vmin; height: 46vmin; border-radius: 50%; left: 0; top: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,244,224,.55) 0%, rgba(255,226,180,.18) 38%, rgba(255,226,180,0) 68%);
    transform: translate(-50%, -50%); transition: left 2s ease, top 2s ease;
  }
  main {
    position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; text-shadow: 0 1px 24px rgba(10,20,50,.25);
  }
  .greeting { font-size: clamp(16px, 2.2vw, 22px); font-weight: 300; letter-spacing: .02em; color: var(--text-soft); margin: 0 0 6px; }
  .clock {
    all: unset; cursor: pointer; font-size: clamp(88px, 21vw, 260px); font-weight: 200; line-height: 1;
    letter-spacing: -.045em; font-variant-numeric: tabular-nums;
    opacity: 0; animation: rise 1.6s .1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .clock:focus-visible, .gear:focus-visible { outline: 2px solid var(--line); outline-offset: 8px; border-radius: 8px; }
  .clock .ampm { font-size: .16em; font-weight: 300; letter-spacing: .04em; margin-left: .35em; vertical-align: .9em; color: var(--text-soft); }
  .date { font-size: clamp(15px, 1.9vw, 20px); font-weight: 300; color: var(--text-soft); margin: 14px 0 0; }
  .focus { margin-top: clamp(40px, 8vh, 88px); width: min(520px, 86vw); }
  .focus input {
    width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--text);
    font: inherit; font-size: clamp(18px, 2.4vw, 24px); font-weight: 300; text-align: center; padding: 10px 4px;
    border-radius: 0; text-shadow: inherit; transition: border-color .3s;
  }
  .focus input::placeholder { color: var(--text-soft); }
  .focus input:focus { outline: none; border-bottom-color: var(--text); }

  /* settings */
  .gear {
    all: unset; cursor: pointer; position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px;
    width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: background .25s, transform .25s;
  }
  .gear:hover { background: var(--glass-strong); }
  .gear[aria-expanded="true"] { transform: rotate(90deg); }
  .gear svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .panel {
    position: fixed; z-index: 15; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 66px);
    width: min(360px, calc(100vw - 32px)); max-height: calc(100% - env(safe-area-inset-top, 0px) - 90px); overflow-y: auto;
    padding: 20px; border-radius: 20px; text-align: left; font-weight: 300;
    background: rgba(20,28,56,.42); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.16); box-shadow: 0 20px 60px rgba(5,10,30,.35);
    opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .panel.open { opacity: 1; transform: none; pointer-events: auto; }
  .panel h2 { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--text-soft); margin: 0 0 10px; }
  .panel section + section { margin-top: 22px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.14); }
  .panel select, .panel input[type="text"], .panel input[type="date"], .panel input[type="time"] {
    width: 100%; font: inherit; font-size: 15px; color: var(--text); background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 10px 12px; color-scheme: dark;
  }
  .panel select option { color: #111; }
  .panel input:focus, .panel select:focus { outline: none; border-color: rgba(255,255,255,.6); }
  .panel input::placeholder { color: var(--text-soft); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 500; color: #0e1630; background: #fff; border: 0; border-radius: 10px;
    padding: 10px 14px; cursor: pointer; width: 100%; margin-top: 8px;
  }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.3); font-weight: 400; }
  .hint { font-size: 13px; color: var(--text-soft); margin: 8px 0 0; line-height: 1.4; }
  .list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 14px; }
  .list .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list .w { display: block; font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .list li.done .t { opacity: .5; text-decoration: line-through; }
  .x { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--text-soft); font-size: 18px; line-height: 1; }
  .x:hover { background: rgba(255,255,255,.16); color: var(--text); }
  .toasts { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 10px; width: min(420px, calc(100vw - 32px)); }
  .toast {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; text-align: left;
    background: rgba(255,255,255,.92); color: #0e1630; box-shadow: 0 14px 40px rgba(5,10,30,.3); animation: drop .4s cubic-bezier(.2,.7,.2,1);
  }
  .toast b { display: block; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #55608a; margin-bottom: 2px; }
  .toast span { flex: 1; font-size: 16px; }
  .toast button { all: unset; cursor: pointer; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 8px; background: #0e1630; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .panel .chips { justify-content: flex-start; }
  .chips button { font: inherit; font-size: 13px; font-weight: 400; color: var(--text); background: var(--glass); border: 0; border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: background .2s, color .2s; }
  .chips button:hover { background: var(--glass-strong); }
  .chips button[aria-pressed="true"] { background: #fff; color: #0e1630; text-shadow: none; }
  .chips button:focus-visible, .ttime:focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }
  .timer { margin-top: clamp(22px, 4vh, 40px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ttime { all: unset; cursor: pointer; font-size: 30px; font-weight: 200; letter-spacing: .02em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 10px; border-radius: 8px; }
  .ttime small { font-size: 11px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--text-soft); }
  .progress { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); pointer-events: none; }
  .progress .track { height: 3px; background: rgba(255,255,255,.16); }
  .progress i { display: block; height: 100%; width: 0; background: rgba(255,255,255,.85); position: relative; transition: width 1s linear; }
  .progress i::after { content: ""; position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translateY(-50%); background: #fff; box-shadow: 0 0 14px 4px rgba(255,236,200,.8); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .clock { animation: none; opacity: 1; } .orb, .panel, .gear { transition: none; } .toast { animation: none; } }
</style>
</head>
<body>
<div class="orb" id="orb"></div>
<div class="veil"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<button class="gear" id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="panel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</button>

<aside class="panel" id="panel" aria-label="Settings">
  <section>
    <h2>Time zone</h2>
    <select id="tz" aria-label="Time zone"></select>
    <p class="hint" id="tzHint"></p>
  </section>
  <section>
    <h2>Sky</h2>
    <div class="chips" id="skyChips" role="group" aria-label="Sky">
      <button type="button" data-s="live" aria-pressed="true">Live</button>
      <button type="button" data-s="dawn" aria-pressed="false">Dawn</button>
      <button type="button" data-s="midday" aria-pressed="false">Midday</button>
      <button type="button" data-s="dusk" aria-pressed="false">Dusk</button>
      <button type="button" data-s="night" aria-pressed="false">Night</button>
    </div>
    <p class="hint">Live follows the clock. Or lock the sky to any time of day.</p>
  </section>
  <section>
    <h2>Sound</h2>
    <div class="chips" id="soundChips" role="group" aria-label="Alert sound">
      <button type="button" data-v="1" aria-pressed="true">On</button>
      <button type="button" data-v="0" aria-pressed="false">Off</button>
      <button type="button" id="soundTest">Play test</button>
    </div>
    <p class="hint">A chime plays when a reminder or the timer goes off. Browsers only allow sound after you’ve clicked or typed on the page once.</p>
  </section>
  <section>
    <h2>Reminders</h2>
    <input type="text" id="rText" maxlength="80" placeholder="Remind me to…" aria-label="Reminder text">
    <div class="row">
      <input type="date" id="rDate" aria-label="Reminder date">
      <input type="time" id="rTime" aria-label="Reminder time">
    </div>
    <button class="btn" id="rAdd" type="button">Add reminder</button>
    <button class="btn ghost" id="rNotify" type="button" hidden>Allow desktop notifications</button>
    <p class="hint" id="rHint">Reminders appear on this page at the chosen time, so keep the tab open.</p>
    <ul class="list" id="rList"></ul>
  </section>
</aside>

<main>
  <p class="greeting" id="greeting"></p>
  <button class="clock" id="clock" type="button" aria-label="Toggle 12 and 24 hour time"></button>
  <p class="date" id="date"></p>
  <div class="focus">
    <input id="focus" type="text" maxlength="90" placeholder="What’s your focus today?" aria-label="Today’s focus" autocomplete="off">
  </div>
  <div class="timer">
    <div class="chips" id="tChips" role="group" aria-label="Timer length">
      <button type="button" data-m="focus" aria-pressed="true">Focus</button>
      <button type="button" data-m="short" aria-pressed="false">Break</button>
      <button type="button" data-m="long" aria-pressed="false">Long break</button>
    </div>
    <button class="ttime" id="tTime" type="button" aria-label="Start or pause timer"></button>
  </div>
</main>
<div class="progress" aria-hidden="true"><div class="track"><i id="pfill"></i></div></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- sky ---------- */
  var stops = [
    [0, "#0b1026", "#1b2447"], [5, "#1d2a5a", "#6b4a7a"], [7, "#3f6fa8", "#e09a86"], [10, "#3a7bc8", "#6aa6d6"],
    [15, "#2f6fb8", "#6aa6d6"], [17.5, "#3c5fa8", "#d9906f"], [19.5, "#2a2a62", "#b0507a"], [21.5, "#101634", "#2a2f66"], [24, "#0b1026", "#1b2447"]
  ];
  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function mix(a, b, t) { var x = hex(a), y = hex(b); return "rgb(" + x.map(function (v, i) { return Math.round(v + (y[i] - v) * t); }).join(",") + ")"; }
  function sky(h) {
    for (var i = 0; i < stops.length - 1; i++) {
      var s = stops[i], e = stops[i + 1];
      if (h >= s[0] && h <= e[0]) { var t = (h - s[0]) / (e[0] - s[0]); return [mix(s[1], e[1], t), mix(s[2], e[2], t)]; }
    }
    return [stops[0][1], stops[0][2]];
  }
  var skyMode = store.get("sol-sky") || "live";
  var skyHours = { dawn: 6.5, midday: 12.5, dusk: 18.5, night: 23 };
  var root = document.documentElement, orb = $("orb");
  function paintSky(p) {
    var h = skyHours[skyMode] !== undefined ? skyHours[skyMode] : p.h + p.m / 60, c = sky(h);
    root.style.setProperty("--sky-top", c[0]); root.style.setProperty("--sky-bottom", c[1]);
    var day = h >= 6 && h <= 20;
    var q = day ? (h - 6) / 14 : ((h < 6 ? h + 24 : h) - 20) / 10;
    orb.style.left = (innerWidth * (0.12 + 0.76 * q)) + "px";
    orb.style.top = (innerHeight * (0.62 - 0.42 * Math.sin(Math.PI * q))) + "px";
    orb.style.opacity = day ? 1 : 0.35;
  }

  /* ---------- time zone ---------- */
  var localTz = "UTC";
  try { localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) {}
  var tzPref = store.get("sol-tz") || "auto";
  function activeTz() { return tzPref === "auto" ? localTz : tzPref; }
  function nice(z) { return z.replace(/_/g, " ").replace(/\//g, " · "); }

  var zones = [];
  try { zones = Intl.supportedValuesOf("timeZone"); } catch (e) {}
  if (!zones.length) zones = ["Pacific/Honolulu", "America/Anchorage", "America/Los_Angeles", "America/Denver", "America/Chicago", "America/New_York", "America/Sao_Paulo", "UTC", "Europe/London", "Europe/Paris", "Europe/Moscow", "Africa/Cairo", "Asia/Dubai", "Asia/Kolkata", "Asia/Bangkok", "Asia/Shanghai", "Asia/Tokyo", "Australia/Sydney", "Pacific/Auckland"];
  var sel = $("tz");
  var o = document.createElement("option"); o.value = "auto"; o.textContent = "Auto-detect (" + nice(localTz) + ")"; sel.appendChild(o);
  zones.forEach(function (z) { var op = document.createElement("option"); op.value = z; op.textContent = nice(z); sel.appendChild(op); });
  sel.value = tzPref; if (sel.value !== tzPref) { tzPref = "auto"; sel.value = "auto"; }

  function parts(d) {
    var tz = activeTz(), f;
    try {
      f = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
    } catch (e) { tzPref = "auto"; f = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); }
    var o = {}; f.formatToParts(d).forEach(function (x) { o[x.type] = x.value; });
    var h = parseInt(o.hour, 10) % 24;
    return { h: h, m: parseInt(o.minute, 10), date: o.year + "-" + o.month + "-" + o.day, stamp: o.year + "-" + o.month + "-" + o.day + "T" + o.hour.replace("24", "00") + ":" + o.minute };
  }
  function fmtTime(h, m) {
    var mm = String(m).padStart(2, "0");
    return h24 ? String(h).padStart(2, "0") + ":" + mm : (h % 12 || 12) + ":" + mm + " " + (h < 12 ? "AM" : "PM");
  }

  /* ---------- clock ---------- */
  var h24 = store.get("nt-24h") === "1";
  var clock = $("clock"), dateEl = $("date"), greet = $("greeting");
  function tick() {
    var d = new Date(), p = parts(d);
    var hh = h24 ? String(p.h).padStart(2, "0") : String(p.h % 12 || 12);
    var t = hh + ":" + String(p.m).padStart(2, "0");
    clock.innerHTML = t + (h24 ? "" : '<span class="ampm">' + (p.h < 12 ? "AM" : "PM") + "</span>");
    var ds = "";
    try { ds = d.toLocaleDateString(undefined, { timeZone: activeTz(), weekday: "long", month: "long", day: "numeric" }); } catch (e) { ds = d.toLocaleDateString(); }
    dateEl.textContent = ds + (tzPref === "auto" ? "" : "  ·  " + nice(tzPref).split(" · ").pop());
    greet.textContent = p.h < 5 ? "Good night" : p.h < 12 ? "Good morning" : p.h < 18 ? "Good afternoon" : "Good evening";
    document.title = t;
    $("tzHint").textContent = "Showing time in " + nice(activeTz()) + ".";
    checkReminders(p);
    $("pfill").style.width = (((p.h * 60 + p.m) / 1440) * 100).toFixed(2) + "%";
    renderTimer();
    return p;
  }
  clock.addEventListener("click", function () { h24 = !h24; store.set("nt-24h", h24 ? "1" : "0"); tick(); renderReminders(); });
  sel.addEventListener("change", function () { tzPref = sel.value; store.set("sol-tz", tzPref); paintSky(tick()); renderReminders(); });

  /* ---------- focus ---------- */
  var focus = $("focus"), dayKey = new Date().toDateString();
  try { var sv = JSON.parse(store.get("nt-focus") || "null"); if (sv && sv.day === dayKey) focus.value = sv.text; } catch (e) {}
  focus.addEventListener("input", function () { store.set("nt-focus", JSON.stringify({ day: dayKey, text: focus.value })); });
  focus.addEventListener("keydown", function (e) { if (e.key === "Enter") focus.blur(); });

  /* ---------- settings panel ---------- */
  var gear = $("gear"), panel = $("panel");
  function togglePanel(open) {
    var on = typeof open === "boolean" ? open : !panel.classList.contains("open");
    panel.classList.toggle("open", on); gear.setAttribute("aria-expanded", on ? "true" : "false");
  }
  gear.addEventListener("click", function () { togglePanel(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") togglePanel(false); });
  document.addEventListener("click", function (e) { if (!panel.contains(e.target) && !gear.contains(e.target)) togglePanel(false); });

  /* ---------- alert sound ---------- */
  var soundOn = store.get("sol-sound") !== "0";
  var ac = null;
  function unlock() {
    try {
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === "suspended") ac.resume();
    } catch (e) {}
  }
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, unlock, { passive: true }); });
  function note(freq, at, len) {
    [[freq, "sine", 0.7], [freq * 2, "triangle", 0.18]].forEach(function (v) {
      var osc = ac.createOscillator(), g = ac.createGain();
      osc.type = v[1]; osc.frequency.value = v[0];
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(v[2], at + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      osc.connect(g); g.connect(ac.destination);
      osc.start(at); osc.stop(at + len + 0.05);
    });
  }
  function ping(force) {
    if (!soundOn && !force) return;
    unlock(); if (!ac) return;
    try {
      var t = ac.currentTime + 0.03;
      note(988, t, 0.9); note(1319, t + 0.17, 1.1);
      note(988, t + 1.2, 0.9); note(1319, t + 1.37, 1.1);
    } catch (e) {}
  }
  var soundBtns = document.querySelectorAll("#soundChips button[data-v]");
  function markSound() { soundBtns.forEach(function (b) { b.setAttribute("aria-pressed", (b.dataset.v === "1") === soundOn ? "true" : "false"); }); }
  soundBtns.forEach(function (b) {
    b.addEventListener("click", function () { soundOn = b.dataset.v === "1"; store.set("sol-sound", soundOn ? "1" : "0"); markSound(); });
  });
  $("soundTest").addEventListener("click", function () { ping(true); });
  markSound();

  /* ---------- reminders ---------- */
  var reminders = [];
  try { reminders = JSON.parse(store.get("sol-reminders") || "[]") || []; } catch (e) { reminders = []; }
  function saveReminders() { store.set("sol-reminders", JSON.stringify(reminders)); }
  var rList = $("rList");

  function whenLabel(at) {
    var date = at.slice(0, 10), h = parseInt(at.slice(11, 13), 10), m = parseInt(at.slice(14, 16), 10);
    var today = parts(new Date()).date, label;
    if (date === today) label = "Today";
    else { var d = new Date(date + "T12:00:00"); label = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
    return label + " · " + fmtTime(h, m);
  }
  function renderReminders() {
    rList.innerHTML = "";
    reminders.slice().sort(function (a, b) { return a.at < b.at ? -1 : 1; }).forEach(function (r) {
      var li = document.createElement("li"); if (r.done) li.className = "done";
      var box = document.createElement("div"); box.className = "t";
      box.appendChild(document.createTextNode(r.text));
      var w = document.createElement("span"); w.className = "w"; w.textContent = whenLabel(r.at); box.appendChild(w);
      var x = document.createElement("button"); x.className = "x"; x.type = "button"; x.setAttribute("aria-label", "Delete reminder"); x.textContent = "×";
      x.addEventListener("click", function () { reminders = reminders.filter(function (q) { return q.id !== r.id; }); saveReminders(); renderReminders(); });
      li.appendChild(box); li.appendChild(x); rList.appendChild(li);
    });
  }
  function toast(text, label) {
    ping();
    var t = document.createElement("div"); t.className = "toast";
    var s = document.createElement("span"), b = document.createElement("b"); b.textContent = label || "Reminder";
    s.appendChild(b); s.appendChild(document.createTextNode(text));
    var btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Dismiss";
    btn.addEventListener("click", function () { t.remove(); });
    t.appendChild(s); t.appendChild(btn); $("toasts").appendChild(t);
  }
  function checkReminders(p) {
    var fired = false;
    reminders.forEach(function (r) {
      if (!r.done && r.at <= p.stamp) {
        r.done = true; fired = true; toast(r.text);
        try { if ("Notification" in window && Notification.permission === "granted") new Notification("Reminder", { body: r.text }); } catch (e) {}
      }
    });
    if (fired) { saveReminders(); renderReminders(); }
  }
  $("rDate").value = parts(new Date()).date;
  $("rAdd").addEventListener("click", function () {
    var text = $("rText").value.trim(), date = $("rDate").value, time = $("rTime").value;
    if (!text || !date || !time) { $("rHint").textContent = "Add a note, a date and a time."; return; }
    reminders.push({ id: Date.now() + Math.random(), text: text, at: date + "T" + time, done: false });
    saveReminders(); $("rText").value = ""; $("rTime").value = ""; $("rHint").textContent = "Reminder added.";
    renderReminders(); checkReminders(parts(new Date()));
  });
  $("rText").addEventListener("keydown", function (e) { if (e.key === "Enter") $("rAdd").click(); });

  var nb = $("rNotify");
  try { if ("Notification" in window && Notification.permission === "default") nb.hidden = false; } catch (e) {}
  nb.addEventListener("click", function () {
    try { Notification.requestPermission().then(function () { nb.hidden = true; }); } catch (e) { nb.hidden = true; }
  });

  /* ---------- sky picker ---------- */
  var skyBtns = document.querySelectorAll("#skyChips button");
  function markSky() { skyBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.s === skyMode ? "true" : "false"); }); }
  skyBtns.forEach(function (b) {
    b.addEventListener("click", function () { skyMode = b.dataset.s; store.set("sol-sky", skyMode); markSky(); paintSky(parts(new Date())); });
  });
  if (skyMode !== "live" && skyHours[skyMode] === undefined) skyMode = "live";
  markSky();

  /* ---------- focus timer ---------- */
  var tMins = { focus: 25, short: 5, long: 15 };
  var tMode = "focus", tLeft = tMins.focus * 60, tEnd = 0, tRunning = false;
  var tBtn = $("tTime");
  function pad(n) { return String(n).padStart(2, "0"); }
  function renderTimer() {
    if (tRunning) {
      tLeft = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
      if (tLeft === 0) {
        tRunning = false;
        var msg = tMode === "focus" ? "Focus session complete. Time for a break." : "Break over. Ready when you are.";
        toast(msg, "Timer");
        try { if ("Notification" in window && Notification.permission === "granted") new Notification("Timer", { body: msg }); } catch (e) {}
        tLeft = tMins[tMode] * 60;
      }
    }
    tBtn.innerHTML = pad(Math.floor(tLeft / 60)) + ":" + pad(tLeft % 60) + "<small>" + (tRunning ? "Pause" : "Start") + "</small>";
  }
  tBtn.addEventListener("click", function () {
    if (tRunning) { renderTimer(); tRunning = false; }
    else { tEnd = Date.now() + tLeft * 1000; tRunning = true; }
    renderTimer();
  });
  document.querySelectorAll("#tChips button").forEach(function (b) {
    b.addEventListener("click", function () {
      tMode = b.dataset.m; tRunning = false; tLeft = tMins[tMode] * 60;
      document.querySelectorAll("#tChips button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      renderTimer();
    });
  });

  /* ---------- go ---------- */
  renderReminders();
  paintSky(tick());
  setInterval(tick, 1000);
  setInterval(function () { paintSky(parts(new Date())); }, 30000);
  addEventListener("resize", function () { paintSky(parts(new Date())); });
})();
</script>
</body>
</html>
