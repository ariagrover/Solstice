<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solstice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --text: #ffffff;
    --text-soft: rgba(255,255,255,.78);
    --line: rgba(255,255,255,.35);
    --veil: rgba(0,0,0,0);
    --sky-top: #3a7bc8;
    --sky-bottom: #6aa6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --veil: rgba(0,0,0,.18); }
  }
  :root[data-theme="dark"] { --veil: rgba(0,0,0,.18); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    color: var(--text);
    font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .veil { position: fixed; inset: 0; background: var(--veil); pointer-events: none; }
  .orb {
    position: fixed; width: 46vmin; height: 46vmin; border-radius: 50%;
    left: 0; top: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,244,224,.55) 0%, rgba(255,226,180,.18) 38%, rgba(255,226,180,0) 68%);
    transform: translate(-50%, -50%);
    transition: left 2s ease, top 2s ease;
  }
  main {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    text-shadow: 0 1px 24px rgba(10,20,50,.25);
  }
  .greeting { font-size: clamp(16px, 2.2vw, 22px); font-weight: 300; letter-spacing: .02em; color: var(--text-soft); margin: 0 0 6px; }
  .clock {
    all: unset; cursor: pointer;
    font-size: clamp(88px, 21vw, 260px); font-weight: 200; line-height: 1;
    letter-spacing: -.045em; font-variant-numeric: tabular-nums;
    opacity: 0; animation: rise 1.6s .1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .clock:focus-visible { outline: 2px solid var(--line); outline-offset: 12px; border-radius: 8px; }
  .clock .ampm { font-size: .16em; font-weight: 300; letter-spacing: .04em; margin-left: .35em; vertical-align: .9em; color: var(--text-soft); }
  .date { font-size: clamp(15px, 1.9vw, 20px); font-weight: 300; color: var(--text-soft); margin: 14px 0 0; }
  .focus { margin-top: clamp(40px, 8vh, 88px); width: min(520px, 86vw); }
  .focus input {
    width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: var(--text); font: inherit; font-size: clamp(18px, 2.4vw, 24px); font-weight: 300;
    text-align: center; padding: 10px 4px; border-radius: 0; text-shadow: inherit;
    transition: border-color .3s;
  }
  .focus input::placeholder { color: var(--text-soft); }
  .focus input:focus { outline: none; border-bottom-color: var(--text); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .clock { animation: none; opacity: 1; }
    .orb { transition: none; }
  }
</style>
</head>
<body>
<div class="orb" id="orb"></div>
<div class="veil"></div>
<main>
  <p class="greeting" id="greeting"></p>
  <button class="clock" id="clock" type="button" aria-label="Toggle 12 and 24 hour time"></button>
  <p class="date" id="date"></p>
  <div class="focus">
    <input id="focus" type="text" maxlength="90" placeholder="What’s your focus today?" aria-label="Today’s focus" autocomplete="off">
  </div>
</main>
<script>
(function () {
  var stops = [
    [0,  "#0b1026", "#1b2447"],
    [5,  "#1d2a5a", "#6b4a7a"],
    [7,  "#3f6fa8", "#e09a86"],
    [10, "#3a7bc8", "#6aa6d6"],
    [15, "#2f6fb8", "#6aa6d6"],
    [17.5, "#3c5fa8", "#d9906f"],
    [19.5, "#2a2a62", "#b0507a"],
    [21.5, "#101634", "#2a2f66"],
    [24, "#0b1026", "#1b2447"]
  ];
  function hex(h) { return [1,3,5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function mix(a, b, t) {
    var x = hex(a), y = hex(b);
    return "rgb(" + x.map(function (v, i) { return Math.round(v + (y[i] - v) * t); }).join(",") + ")";
  }
  function sky(h) {
    for (var i = 0; i < stops.length - 1; i++) {
      var s = stops[i], e = stops[i + 1];
      if (h >= s[0] && h <= e[0]) {
        var t = (h - s[0]) / (e[0] - s[0]);
        return [mix(s[1], e[1], t), mix(s[2], e[2], t)];
      }
    }
    return [stops[0][1], stops[0][2]];
  }

  var root = document.documentElement, orb = document.getElementById("orb");
  var clock = document.getElementById("clock"), dateEl = document.getElementById("date");
  var greet = document.getElementById("greeting"), focus = document.getElementById("focus");
  var h24 = false;
  try { h24 = localStorage.getItem("nt-24h") === "1"; } catch (e) {}

  function paintSky(d) {
    var h = d.getHours() + d.getMinutes() / 60;
    var c = sky(h);
    root.style.setProperty("--sky-top", c[0]);
    root.style.setProperty("--sky-bottom", c[1]);
    var day = h >= 6 && h <= 20;
    var p = day ? (h - 6) / 14 : ((h < 6 ? h + 24 : h) - 20) / 10;
    var w = window.innerWidth, ht = window.innerHeight;
    orb.style.left = (w * (0.12 + 0.76 * p)) + "px";
    orb.style.top = (ht * (0.62 - 0.42 * Math.sin(Math.PI * p))) + "px";
    orb.style.opacity = day ? 1 : 0.35;
  }

  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var hh = h24 ? String(h).padStart(2, "0") : String(h % 12 || 12);
    clock.innerHTML = hh + ":" + String(m).padStart(2, "0") +
      (h24 ? "" : '<span class="ampm">' + (h < 12 ? "AM" : "PM") + "</span>");
    dateEl.textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    greet.textContent = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    document.title = hh + ":" + String(m).padStart(2, "0");
    return d;
  }

  clock.addEventListener("click", function () {
    h24 = !h24;
    try { localStorage.setItem("nt-24h", h24 ? "1" : "0"); } catch (e) {}
    tick();
  });

  // Focus resets each day
  var dayKey = new Date().toDateString();
  try {
    var saved = JSON.parse(localStorage.getItem("nt-focus") || "null");
    if (saved && saved.day === dayKey) focus.value = saved.text;
  } catch (e) {}
  focus.addEventListener("input", function () {
    try { localStorage.setItem("nt-focus", JSON.stringify({ day: dayKey, text: focus.value })); } catch (e) {}
  });
  focus.addEventListener("keydown", function (e) { if (e.key === "Enter") focus.blur(); });

  paintSky(tick());
  setInterval(tick, 1000);
  setInterval(function () { paintSky(new Date()); }, 30000);
  window.addEventListener("resize", function () { paintSky(new Date()); });
})();
</script>
</body>
</html>
